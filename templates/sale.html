<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard | Exchange Royal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400;500;600;700&display=swap">

  <style>
    body {
      font-family: 'General Sans', sans-serif;
      background-color: #030014;
      margin: 0;
      overflow-x: hidden;
    }

    @keyframes background-gradient {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(calc(30% * var(--tx-1, 1)), calc(30% * var(--ty-1, 1))); }
      40% { transform: translate(calc(30% * var(--tx-2, -1)), calc(30% * var(--ty-2, 1))); }
      60% { transform: translate(calc(30% * var(--tx-3, 1)), calc(30% * var(--ty-3, -1))); }
    }

    .animate-gradient-bg {
      animation: background-gradient 20s infinite alternate ease-in-out;
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center relative bg-slate-950/20 px-4">

  <a href="/home" class="absolute top-4 right-4 z-50 p-2 rounded-lg bg-white/5 hover:bg-white/10 transition text-white/70 hover:text-white border border-white/5" style="background-color:black">
      <i data-lucide="x" class="w-4 h-4" style="color:white"></i>
  </a>


  <div id="gradient-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600 rounded-full blur-[120px] animate-gradient-bg" style="--tx-1: 1; --ty-1: -1; --tx-2: -1; --ty-2: 1; --tx-3: 0.5; --ty-3: 0.5;"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-600 rounded-full blur-[120px] animate-gradient-bg" style="--tx-1: -1; --ty-1: 1; --tx-2: 1; --ty-2: -1; --tx-3: -0.5; --ty-3: -0.5;"></div>
  </div>

  <div class="relative z-10 w-full max-w-md p-8 rounded-3xl bg-[#120f24]/50 border border-white/10 backdrop-blur-xl shadow-2xl transition-all duration-300 hover:border-white/20 text-left">
    
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
      <div>
        <h2 class="text-xl font-bold tracking-tight text-zinc-100 capitalize">Purchase {{ name }}</h2>
        <p class="text-xs text-zinc-400 mt-1">Real-time settlement desk</p>
      </div>
      <div class="p-3 bg-white/5 rounded-2xl border border-white/10 text-purple-400">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
      </div>
    </div>

    <div class="mb-6 p-4 rounded-2xl bg-white/5 border border-white/5 flex justify-between items-center text-sm">
      <span class="text-zinc-400" style="color:white">Current Market Rate:</span>
      <span class="font-mono font-bold text-emerald-400">{{ rate }} IRR</span>
    </div>

    <div class="space-y-5 text-sm">
      
      <div class="p-4 rounded-2xl bg-white/5 border border-white/5 focus-within:border-purple-500/50 transition-colors">
        <label for="count" class="block text-xs text-zinc-400 mb-1.5" style="color:white">Amount to Purchase ({{ name | upper }})</label>
        <div class="flex items-center justify-between">
          <input type="number" id="count" name="value" class="w-full bg-transparent font-mono text-lg text-zinc-200 focus:outline-none text-left" placeholder="0.00" min="1" required>
          <span class="text-xs font-bold text-zinc-500 ml-2 uppercase" style="color:white">{{ name }}</span>
        </div>
      </div>

      <div class="p-4 rounded-2xl bg-purple-500/5 border border-purple-500/10 flex justify-between items-center text-sm">
        <span class="text-zinc-400" style="color:white">Estimated Cost:</span>
        <div class="text-right font-mono font-semibold text-purple-300">
          <span id="convert">0</span> <span class="text-xs text-zinc-500" style="color:white">TRY</span>
        </div>
      </div>

      <button type="button" id="placeOrder" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm rounded-xl py-3.5 mt-2 shadow-lg shadow-purple-600/20 transition-all duration-200 flex items-center justify-center gap-2">
        <i data-lucide="wallet" class="w-4 h-4"></i>
        Secure Purchase Order
      </button>

      <div id="error" class="text-center text-xs mt-2 font-medium min-h-[16px]"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const countInput = document.getElementById('count');
    const convertDisplay = document.getElementById('convert');
    const placeOrderBtn = document.getElementById('placeOrder');
    const errorMsg = document.getElementById('error');

    const currentRate = parseFloat("{{ rate }}");

    function updateConversion() {
      const amount = parseFloat(countInput.value);
      if (!isNaN(amount) && amount > 0) {
        const total = amount * currentRate;
        convertDisplay.innerText = total.toLocaleString(); 
      } else {
        convertDisplay.innerText = "0";
      }
    }

    countInput.addEventListener('input', updateConversion);

    placeOrderBtn.addEventListener('click', async () => {
      const amountValue = countInput.value.trim();

      if (!amountValue || parseFloat(amountValue) <= 0) {
        errorMsg.innerText = "Please enter a valid asset amount.";
        errorMsg.style.color = "#ef4444";
        return;
      }

      errorMsg.innerText = "Processing checkout session...";
      errorMsg.style.color = "rgba(255, 255, 255, 0.6)";

      const dataForm = new FormData();
      dataForm.append('value', amountValue);

      try {
        const res = await fetch("/sale/{{ name }}", {
          method: "POST",
          body: dataForm
        });
        
        const response = await res.json();

        if (response.success) {
          errorMsg.innerText = "Order logged! Redirecting to payment gateway...";
          errorMsg.style.color = "#10b981";
          setTimeout(() => {
            window.location.href = response.redirect_url;
          }, 1200);
        } else {
          errorMsg.innerText = response.message || "Checkout rejected. Verify system session status.";
          errorMsg.style.color = "#ef4444";
        }
      } catch (err) {
        errorMsg.innerText = "Network communication breakdown. Try again.";
        errorMsg.style.color = "#ef4444";
        console.error("Purchase error trace:", err);
      }
    });
  </script>
</body>
</html>
