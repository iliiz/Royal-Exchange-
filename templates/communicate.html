<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400;500;600;700&display=swap">

    <style>
        body {
            font-family: 'General Sans', sans-serif;
            background-color: #050214;
            margin: 0;
            overflow: hidden;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 50%, rgba(99, 68, 245, 0.12) 0%, rgba(3, 0, 20, 0) 60%);
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-full h-screen relative flex items-center justify-center antialiased text-white">

    <a href="/home" class="absolute top-4 right-4 z-50 p-2 rounded-lg bg-white/5 hover:bg-white/10 transition text-white/70 hover:text-white border border-white/5">
        <i data-lucide="x" class="w-4 h-4"></i>
    </a>

    <canvas id="particles-canvas"></canvas>

    <div class="absolute inset-0 ambient-glow pointer-events-none z-0"></div>

    <div class="relative z-10 flex flex-col items-center justify-center px-4 max-w-lg text-center select-none">
        
        <a href="/contact" class="group relative inline-flex items-center justify-center px-16 py-6 rounded-full bg-[#0d0a21]/90 border border-white/10 hover:border-indigo-500/50 shadow-[0_0_50px_-12px_rgba(99,68,245,0.25)] hover:shadow-[0_0_60px_-5px_rgba(99,68,245,0.45)] transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
            <div class="absolute inset-0 rounded-full bg-gradient-to-r from-indigo-500/20 to-purple-500/20 opacity-0 group-hover:opacity-100 blur-md transition-opacity duration-300"></div>
            
            <div class="relative flex items-center gap-3">
                <i data-lucide="message-square" class="w-5 h-5 text-indigo-400 group-hover:animate-bounce"></i>
                <span class="text-xl font-semibold tracking-wide text-white group-hover:text-indigo-200 transition-colors" id="connect">Connect</span>
            </div>
        </a>

        <p class="mt-4 text-xs text-white/40 tracking-wider uppercase">Click to open live support channel</p>

        <div class="w-32 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent my-12"></div>

        <div class="w-full grid grid-cols-1 gap-3 sm:grid-cols-2">
            
            <div class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 backdrop-blur-sm hover:bg-white/[0.04] transition">
                <div class="w-10 h-10 rounded-lg bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20">
                    <i data-lucide="mail" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <div class="text-left">
                    <p class="text-[10px] uppercase tracking-widest text-white/40">Official Email</p>
                    <a href="mailto:support@yourdomain.com" class="text-sm font-medium text-white/80 hover:text-indigo-400 transition">support@anoai.com</a>
                </div>
            </div>

            <div class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 backdrop-blur-sm hover:bg-white/[0.04] transition">
                <div class="w-10 h-10 rounded-lg bg-purple-500/10 flex items-center justify-center border border-purple-500/20">
                    <i data-lucide="phone" class="w-4 h-4 text-purple-400"></i>
                </div>
                <div class="text-left">
                    <p class="text-[10px] uppercase tracking-widest text-white/40">Direct Phone</p>
                    <a href="tel:+982112345678" class="text-sm font-medium text-white/80 hover:text-purple-400 transition">+98 (21) 8888-4422</a>
                </div>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const sparks = [];
        const maxSparks = 45; 

        const colors = ['#18CCFC', '#6344F5', '#AE48FF'];

        class Spark {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                
                this.length = Math.random() * 60 + 40; 
                
                this.speedX = Math.random() * 2 + 1.5;
                this.speedY = Math.random() * 1.5 + 1;
                
                this.alpha = 0;
                this.fadeSpeed = Math.random() * 0.02 + 0.01;
                this.isFadingOut = false;
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.width = Math.random() * 1.5 + 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (!this.isFadingOut) {
                    this.alpha += this.fadeSpeed;
                    if (this.alpha >= 1) {
                        this.alpha = 1;
                        this.isFadingOut = true; 
                    }
                } else {
                    this.alpha -= this.fadeSpeed * 0.6; 
                    if (this.alpha <= 0) {
                        this.reset(); 
                    }
                }

                if (this.x > canvas.width || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';

                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.speedX * (this.length / 5), this.y - this.speedY * (this.length / 5));
                ctx.stroke();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxSparks; i++) {
            setTimeout(() => {
                sparks.push(new Spark());
            }, Math.random() * 3000);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sparks.forEach(spark => {
                spark.update();
                spark.draw();
            });

            requestAnimationFrame(animate);
        }
        
        animate();
        const connect = document.getElementById("connect");
        connect.addEventListener('click', () => {
            window.location.href = "/contact";
        });
    </script>
</body>
</html>
